<mat-sidenav-container class="shell">
  <mat-sidenav
    #drawer
    class="shell__nav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()">
    <div class="shell__brand">
      <mat-icon aria-hidden="true">support_agent</mat-icon>
      <span>Support CRM</span>
    </div>
    <mat-nav-list aria-label="Main navigation">
      @for (item of navItems(); track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive
          #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          [activated]="rla.isActive"
          (click)="isHandset() && drawer.close()">
          <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="shell__toolbar">
      @if (isHandset()) {
        <button mat-icon-button type="button" aria-label="Open navigation" (click)="drawer.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="shell__title">Customer Support CRM</span>
      <span class="shell__spacer"></span>
      @if (isStaff()) {
        <crm-notification-bell />
      }
      @if (user(); as user) {
        <span class="shell__user">{{ user.firstName }} {{ user.lastName }}</span>
      }
      <button mat-icon-button type="button" aria-label="Sign out" (click)="signOut()">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>
    <main class="shell__content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
