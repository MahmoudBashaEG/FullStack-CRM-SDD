<crm-page-header icon="timer" [title]="'sla.page.title' | t" [subtitle]="'sla.page.subtitle' | t" />

<mat-tab-group animationDuration="0ms" [selectedIndex]="tabs.index()" (selectedIndexChange)="tabs.select($event)">
  <mat-tab [label]="'sla.tabs.policy' | t">
    <ng-template matTabContent><crm-sla-policy-form /></ng-template>
  </mat-tab>
  <mat-tab [label]="'sla.tabs.calendar' | t">
    <ng-template matTabContent><crm-business-calendar-form /></ng-template>
  </mat-tab>
  <mat-tab [label]="'sla.tabs.rules' | t">
    <ng-template matTabContent><crm-automation-rules /></ng-template>
  </mat-tab>
  <mat-tab [label]="'sla.tabs.overview' | t">
    <ng-template matTabContent><crm-sla-overview /></ng-template>
  </mat-tab>
</mat-tab-group>
