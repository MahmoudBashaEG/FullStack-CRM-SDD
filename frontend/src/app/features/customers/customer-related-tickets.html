<p class="hint">{{ 'customers.tickets.hint' | t }}</p>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
}

@if (error(); as message) {
  <p class="form-error" role="alert">{{ message }}</p>
  <button mat-button type="button" (click)="retry()">{{ 'common.retry' | t }}</button>
}

@if (loaded() && items().length === 0 && !error()) {
  <crm-empty-state icon="confirmation_number" [message]="'customers.tickets.empty' | t" />
}

<div class="thread">
  @for (t of items(); track t.id) {
    <article>
      <header class="record-meta">
        <a [routerLink]="['/tickets', t.id]">{{ t.subject }}</a>
        <crm-status-badge [label]="('enums.ticketStatus.' + t.status) | t" [tone]="statusTone(t.status)" />
        <crm-status-badge [label]="('enums.ticketPriority.' + t.priority) | t" [tone]="priorityTone(t.priority)" />
        <span class="hint">{{ t.createdAtUtc | crmDate: 'date' }}</span>
      </header>
    </article>
  }
</div>

@if (hasMore() && !loading()) {
  <button mat-button type="button" (click)="loadMore()">{{ 'customers.tickets.loadMore' | t }}</button>
}
